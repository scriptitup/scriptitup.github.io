<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Script It Up - Tell us about your project and we'll get back to you.">
    <meta name="keywords" content="script it up, scripting, development, services, contact">
    <meta name="author" content="Script It Up">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="color-scheme" content="light dark">

    <title>Script It Up</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="canonical" href="https://scriptitup.github.io/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Script It Up">
    <meta property="og:title" content="Script It Up">
    <meta property="og:description" content="Tell us about your project and we'll get back to you.">
    <meta property="og:url" content="https://scriptitup.github.io/">
    <meta property="og:image" content="https://scriptitup.github.io/assets/logo.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Script It Up">
    <meta name="twitter:description" content="Tell us about your project and we'll get back to you.">
    <meta name="twitter:image" content="https://scriptitup.github.io/assets/logo.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Script It Up</h1>
            <p>Tell us about your project and we'll get back to you.</p>
        </section>

        <form id="contact-form" class="contact-form" novalidate>
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <label for="phone">Phone (optional)</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="field">
                <label for="service">Service needed</label>
                <input type="text" id="service" name="service">
            </div>

            <div class="field">
                <label for="budget">Budget</label>
                <input type="text" id="budget" name="budget">
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit" id="submit-btn">Send</button>
            <p id="status" class="status" role="status"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
